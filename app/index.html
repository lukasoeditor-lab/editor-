<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e5e1d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>V'Sensi Gestão</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="symbol.png" alt="" class="brand-logo">
      <div>
        <strong>V'SENSI</strong>
        <small>Aromatizantes</small>
      </div>
    </div>
    <div class="top-actions">
      <label class="month-picker">
        <input type="month" id="month">
      </label>
      <button class="icon-btn" id="open-more" aria-label="Mais opções">⚙</button>
    </div>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Novo">+</button>

  <nav class="tabbar">
    <button data-tab="inicio" class="active"><span>◎</span>Início</button>
    <button data-tab="feiras"><span>⛺</span>Feiras</button>
    <button data-tab="lancamentos"><span>⇅</span>Caixa</button>
    <button data-tab="produtos"><span>❦</span>Produtos</button>
    <button data-tab="contas"><span>◷</span>Contas</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="modal-ok">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="ask" class="ask">
    <p id="ask-msg"></p>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="ask-cancel">Cancelar</button>
      <button type="button" class="btn danger-fill" id="ask-ok">Confirmar</button>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
