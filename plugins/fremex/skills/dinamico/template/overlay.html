<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FREMEX overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Instrument+Serif:ital@1&family=IBM+Plex+Mono:wght@500&display=block">
<style>
/* Camada de motion graphics com fundo transparente. Tudo é função do tempo (window.seek). */
:root { --destaque: #6A96DE; --base: #2459A6; --texto: #F3F4F6; --fundo: rgba(8,10,15,.78); --borda: rgba(243,244,246,.14); }
* { margin: 0; box-sizing: border-box; }
html, body { background: transparent; overflow: hidden; }
#palco { position: relative; overflow: hidden; color: var(--texto); font-family: "Archivo", Arial, sans-serif; }
.el { position: absolute; will-change: transform, opacity; }
.titulo { left: 6%; right: 6%; text-align: center; font-weight: 800; font-stretch: 118%; line-height: 1.02; letter-spacing: -.01em;
  text-shadow: 0 8px 40px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.5); text-wrap: balance; }
.titulo em, .destaque em, .cta em { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; font-stretch: 100%; color: var(--destaque);
  text-shadow: 0 0 26px color-mix(in srgb, var(--base) 85%, transparent), 0 4px 30px rgba(0,0,0,.6); }
.destaque { left: 50%; transform-origin: 50% 50%; padding: .45em .9em; border-radius: 999px; background: var(--fundo); border: 3px solid var(--destaque);
  font-weight: 700; font-stretch: 112%; white-space: nowrap; box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 34px color-mix(in srgb, var(--base) 55%, transparent); }
.numero { right: 6%; font-family: "Instrument Serif", serif; font-style: italic; line-height: 1; color: #DCE7FA;
  text-shadow: 0 0 18px color-mix(in srgb, var(--destaque) 90%, transparent), 0 0 60px color-mix(in srgb, var(--base) 80%, transparent); }
.rotulo { left: 6%; font-weight: 700; font-stretch: 118%; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
.lower { left: 6%; display: flex; flex-direction: column; gap: .25em; padding: .6em 1em .7em; background: var(--fundo); border-left: 6px solid var(--destaque);
  border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
.lower b { font-weight: 800; font-stretch: 112%; }
.lower span { font-family: "IBM Plex Mono", monospace; font-size: .62em; letter-spacing: .12em; text-transform: uppercase; color: var(--destaque); }
.progresso { left: 0; top: 0; height: 10px; background: linear-gradient(90deg, var(--base), var(--destaque)); box-shadow: 0 0 18px var(--destaque); }
.cta { left: 8%; right: 8%; display: flex; flex-direction: column; align-items: center; gap: .55em; text-align: center; }
.cta .t { font-weight: 800; font-stretch: 118%; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
.cta .caixa { width: 100%; padding: .55em 1em; border-radius: 999px; border: 3px solid var(--destaque); background: var(--fundo); text-align: left;
  font-size: .62em; box-shadow: 0 0 34px color-mix(in srgb, var(--base) 50%, transparent); }
.cta .botao { padding: .4em 1.4em; border-radius: 999px; border: 3px solid var(--texto); font-size: .6em; font-weight: 700; }
svg.circulo { position: absolute; overflow: visible; }
</style>
</head>
<body>
<div id="palco"></div>
<script>
// A edição chega em window.EDICAO (injetada pelo overlay.js).
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const md = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/\*(.+?)\*/g, '<em>$1</em>');

let W = 1080, H = 1920, ELEMENTOS = [], DURACAO = 10;
function montar(ed) {
  [W, H] = ed.formato || [1080, 1920];
  DURACAO = ed.duracao || 10;
  const palco = document.getElementById('palco');
  palco.style.width = W + 'px'; palco.style.height = H + 'px';
  const c = ed.cores || {};
  if (c.destaque) document.documentElement.style.setProperty('--destaque', c.destaque);
  if (c.base) document.documentElement.style.setProperty('--base', c.base);
  if (c.texto) document.documentElement.style.setProperty('--texto', c.texto);
  const u = W / 1080;
  ELEMENTOS = (ed.overlays || []).map(o => {
    const el = document.createElement('div'); el.className = 'el ' + o.tipo;
    const y = (frac) => (o.y ?? frac) * H;
    if (o.tipo === 'titulo') { el.style.top = y(0.2) + 'px'; el.style.fontSize = (o.tamanho || 104) * u + 'px'; el.innerHTML = md(o.texto); }
    if (o.tipo === 'destaque') { el.style.top = y(0.14) + 'px'; el.style.fontSize = (o.tamanho || 54) * u + 'px'; el.innerHTML = md(o.texto); }
    if (o.tipo === 'lista') {
      const n = document.createElement('div'); n.className = 'el numero'; n.style.top = y(0.07) + 'px'; n.style.fontSize = 240 * u + 'px'; n.textContent = o.numero;
      el.className = 'el rotulo'; el.style.top = y(0.1) + 'px'; el.style.fontSize = (o.tamanho || 84) * u + 'px'; el.innerHTML = md(o.texto);
      palco.appendChild(n); o._num = n;
    }
    if (o.tipo === 'lower') { el.style.top = y(0.6) + 'px'; el.style.fontSize = (o.tamanho || 48) * u + 'px'; el.innerHTML = `<b>${md(o.texto)}</b>` + (o.sub ? `<span>${md(o.sub)}</span>` : ''); }
    if (o.tipo === 'progresso') { el.style.height = 10 * u + 'px'; }
    if (o.tipo === 'cta') {
      el.style.top = y(0.36) + 'px'; el.style.fontSize = (o.tamanho || 72) * u + 'px';
      el.innerHTML = `<div class="t">${md(o.texto)}</div>` + (o.palavra ? `<div class="caixa"><span class="dig"></span></div><div class="botao">Seguir</div>` : '');
    }
    if (o.tipo === 'circulo') {
      const r = (o.raio || 0.12) * W, cx = (o.x ?? 0.5) * W, cy = (o.y ?? 0.4) * H;
      el.innerHTML = `<svg class="circulo" width="${W}" height="${H}" style="left:0;top:0"><ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r * 0.82}" fill="none"
        stroke="var(--destaque)" stroke-width="${10 * u}" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"
        style="filter:drop-shadow(0 0 ${14 * u}px var(--destaque))"/></svg>`;
      el.style.inset = '0';
    }
    palco.appendChild(el); o._el = el;
    return o;
  });
}

function seek(t) {
  for (const o of ELEMENTOS) {
    const el = o._el, ini = o.inicio ?? 0, fim = o.fim ?? DURACAO;
    const vis = t >= ini - 0.01 && t <= fim + 0.35;
    el.style.display = vis ? '' : 'none';
    if (o._num) o._num.style.display = el.style.display;
    if (!vis) continue;
    const a = prog(t, ini, ini + 0.35), s = prog(t, fim, fim + 0.3);
    if (o.tipo === 'titulo') {
      el.style.opacity = eOut(a) * (1 - s);
      el.style.transform = `translateY(${(1 - eOut(a)) * 60}px) scale(${0.92 + 0.08 * eOut(a) + 0.03 * prog(t, ini, fim)})`;
      el.style.filter = `blur(${(1 - eOut(a)) * 14 + s * 10}px)`;
    } else if (o.tipo === 'destaque') {
      const k = eBack(prog(t, ini, ini + 0.42));
      el.style.opacity = clamp(a * 3) * (1 - s);
      el.style.transform = `translateX(-50%) scale(${Math.max(0, k) * (1 - 0.15 * s)}) rotate(${(1 - clamp(k)) * -6}deg)`;
    } else if (o.tipo === 'lista') {
      el.style.opacity = eOut(a) * (1 - s); el.style.transform = `translateX(${(1 - eOut(a)) * -70}px)`;
      o._num.style.opacity = eOut(a) * (1 - s);
      o._num.style.transform = `translateY(${(1 - eOut(a)) * 50}px) scale(${1.15 - 0.15 * eOut(a)})`; o._num.style.filter = `blur(${(1 - eOut(a)) * 10}px)`;
    } else if (o.tipo === 'lower') {
      el.style.opacity = eOut(a) * (1 - s); el.style.transform = `translateX(${(1 - eOut(a)) * -120}px)`;
    } else if (o.tipo === 'progresso') {
      el.style.width = (clamp(t / DURACAO) * W) + 'px'; el.style.opacity = 1;
    } else if (o.tipo === 'cta') {
      el.style.opacity = eOut(a); el.style.transform = `translateY(${(1 - eOut(a)) * 50}px)`;
      const dig = el.querySelector('.dig');
      if (dig) {
        const n = Math.floor(o.palavra.length * prog(t, ini + 0.5, ini + 1.1));
        dig.textContent = n ? o.palavra.slice(0, n) + (n < o.palavra.length ? '▌' : '') : 'Adicione um comentário…';
        dig.style.opacity = n ? 1 : 0.55;
        const b = el.querySelector('.botao'), seguiu = t > ini + 1.6;
        b.textContent = seguiu ? 'Seguindo ✓' : 'Seguir';
        b.style.background = seguiu ? 'var(--texto)' : 'transparent'; b.style.color = seguiu ? '#080A0F' : 'var(--texto)';
      }
    } else if (o.tipo === 'circulo') {
      el.style.opacity = 1 - s;
      el.querySelector('ellipse').setAttribute('stroke-dashoffset', String(1 - eOut(prog(t, ini, ini + 0.5))));
    }
  }
}
window.montar = montar; window.seek = seek;
</script>
</body>
</html>
